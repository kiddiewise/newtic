name: Diagnose PAYTR 2nd-step callback on isolated Polaris staging

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/paytr-merchant-retry-20261123
    paths:
      - .github/workflows/paytr-notification-20261123.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify public PAYTR notification path without a payment
        shell: bash
        run: |
          set -euo pipefail
          SITE="powderblue-dinosaur-538060.hostingersite.com"
          ROUTE="/odeme/paytr/bildirim"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          for mode in public origin; do
            args=()
            if [[ "$mode" = origin ]]; then
              args+=(--resolve "$SITE:443:147.79.123.121")
            fi
            set +e
            RESULT="$(curl -4 --http1.1 -sS --connect-timeout 10 --max-time 18 "${args[@]}" -o "$TMP/$mode.body" -D "$TMP/$mode.head" -w 'status=%{http_code} tls=%{ssl_verify_result} redirects=%{num_redirects} seconds=%{time_total}' -X POST --data-urlencode 'merchant_oid=NEWTICINVALIDPROBE' --data-urlencode 'status=success' --data-urlencode 'total_amount=12345' --data-urlencode 'hash=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' --data-urlencode 'payment_type=card' --data-urlencode 'currency=TL' "https://$SITE$ROUTE")"
            CODE=$?
            set -e
            echo "$mode curl_exit=$CODE $RESULT"
            if grep -Fqx 'Invalid PAYTR notification' "$TMP/$mode.body"; then echo "$mode reached_laravel_hmac_guard=yes"; else echo "$mode reached_laravel_hmac_guard=no"; fi
            if grep -Fqx 'PAYTR callback is not active' "$TMP/$mode.body"; then echo "$mode webhook_gate_disabled=yes"; fi
            if grep -iq '^x-hcdn-request-id:' "$TMP/$mode.head"; then echo "$mode hostinger_cdn=yes"; fi
          done
      - name: Hostinger application diagnostic, sanitized callback counts and outbound PayTR TLS
        env:
          KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$KNOWN"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/paytr-diag"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/paytr-diag" "$HOME/.ssh/known_hosts"
          ssh -p 65002 -i "$HOME/.ssh/paytr-diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic"
          echo "deployed_revision=$(git rev-parse --short HEAD)"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $yn=static fn($v)=>$v?'yes':'no';
          $host=parse_url((string) config('app.url'),PHP_URL_HOST);
          echo 'expected_host='.$yn($host==='powderblue-dinosaur-538060.hostingersite.com').PHP_EOL;
          echo 'checkout_is_staging='.$yn((bool)config('newtic.checkout_test_mode')).PHP_EOL;
          echo 'paytr_cards_gate='.$yn((bool)config('newtic.paytr_card_payments_enabled')).PHP_EOL;
          echo 'paytr_webhook_gate='.$yn((bool)config('newtic.paytr_webhooks_enabled')).PHP_EOL;
          $s=\App\Models\PaytrSetting::find(1);
          echo 'paytr_settings_present='.$yn((bool)$s).PHP_EOL;
          echo 'paytr_credentials_saved='.$yn((bool)$s?->hasCredentials()).PHP_EOL;
          echo 'paytr_admin_active='.$yn((bool)$s?->is_enabled).PHP_EOL;
          echo 'paytr_is_provider_test='.$yn((bool)$s?->test_mode).PHP_EOL;
          echo 'attempt_count='.(int)\App\Models\PaytrPaymentAttempt::count().PHP_EOL;
          // Match only a short identifier prefix from the customer's new PAYTR
          // screenshot, without disclosing the merchant order reference.
          $latestFromScreenshot=\App\Models\PaytrPaymentAttempt::query()
              ->where('merchant_oid','like','NTND7N2%')->latest('id')->first();
          echo 'screenshot_recent_attempt_exists='.$yn((bool)$latestFromScreenshot).PHP_EOL;
          if($latestFromScreenshot){
              echo 'screenshot_recent_attempt_status='.$latestFromScreenshot->status.PHP_EOL;
              echo 'screenshot_recent_order_status='.($latestFromScreenshot->order?->status??'missing').PHP_EOL;
              echo 'screenshot_recent_attempt_age_minutes='.(int)$latestFromScreenshot->created_at->diffInMinutes(now()).PHP_EOL;
          }
          foreach(\App\Models\PaytrPaymentAttempt::query()->latest('id')->limit(3)->get() as $index=>$a){
              echo 'latest_attempt_'.$index.'_status='.$a->status.PHP_EOL;
              echo 'latest_attempt_'.$index.'_age_minutes='.(int)$a->created_at->diffInMinutes(now()).PHP_EOL;
              echo 'latest_attempt_'.$index.'_order_status='.($a->order?->status??'missing').PHP_EOL;
          }
          echo 'callback_route_configured='.route('checkout.paytr.callback').PHP_EOL;
          echo 'screenshot_recent_processed_at_utc='.($latestFromScreenshot?->processed_at?->utc()?->format('Y-m-d H:i:s') ?? 'missing').PHP_EOL;
          $processed=\App\Models\PaytrPaymentAttempt::query()->where('status','success')
              ->orderByDesc('processed_at')->limit(10)->get();
          foreach($processed as $idx=>$p) {
              echo 'successful_attempt_'.$idx.'_processed_utc='.($p->processed_at?->utc()?->format('Y-m-d H:i:s')??'missing').PHP_EOL;
              echo 'successful_attempt_'.$idx.'_order_preparing='.($p->order?->status==='preparing'?'yes':'no').PHP_EOL;
          }
          foreach(['pending','success','failed'] as $state){echo 'attempt_'.$state.'_count='.(int)\App\Models\PaytrPaymentAttempt::where('status',$state)->count().PHP_EOL;}
          echo 'unsigned_webhook_must_be_rejected=yes'.PHP_EOL;
          PHP
          php artisan route:list --path=odeme/paytr/bildirim --json | php -r '
            $a=json_decode(stream_get_contents(STDIN),true)??[];
            foreach($a as $r){if(($r["uri"]??"")==="odeme/paytr/bildirim"){
              echo "callback_methods=".$r["method"]."\n";
              echo "callback_auth_guard=". (str_contains(implode(",",$r["middleware"]??[]),"auth")?"yes":"no")."\n";
            }}'
          # Count only generic callbacks, never print raw log payloads or IPs.
          echo "configured_log_channel=$(php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("logging.default");')"
          for log in storage/logs/*.log; do
            [[ -f "$log" ]] || continue
            echo "laravel_log_file_present=yes"
            for code in paytr_callback_accepted paytr_callback_rejected; do
              count="$(tail -n 30000 "$log" | grep -Fc "$code" || true)"
              echo "log_event_${code}=$count"
            done
          done
          if [[ -f storage/logs/laravel.log ]]; then
            for word in paytr_callback_accepted paytr_callback_rejected paytr_iframe_test_failure staging_gate settings_gate invalid_signature invalid_payment_context unknown_attempt order_state_mismatch; do
              count="$(tail -n 8000 storage/logs/laravel.log | grep -Fc "$word" || true)"
              printf 'last8000_%s=%s\n' "$word" "$count"
            done
          fi
          # Shared Hostinger may hide server access logs; report only aggregate
          # evidence about PayTR's two provider-reported source addresses.
          echo "== Hostinger ingress controls (no raw log lines) =="
          for conf in "$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/public_html/.htaccess" "$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/public/.htaccess"; do
            if [[ -r "$conf" ]]; then
              echo "htaccess_present=yes"
              echo "htaccess_custom_ip_restriction_lines=$(grep -Eic 'Require (not )?ip|Deny from|Allow from|REMOTE_ADDR' "$conf" || true)"
            fi
          done
          HAVE_LOG=no
          for folder in "$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/logs" "$HOME/.logs"; do
            for file in "$folder/access.log" "$folder/access_log" "$folder/access.log.1"; do
              if [[ -r "$file" ]]; then
                HAVE_LOG=yes
                count="$(tail -n 50000 "$file" | grep -Fc '/odeme/paytr/bildirim' || true)"
                echo "callback_hits_access_log_last50000=$count"
                for ip in 212.252.97.250 213.74.97.150; do
                  count="$(tail -n 50000 "$file" | grep -F "$ip" | grep -Fc '/odeme/paytr/bildirim' || true)"
                  echo "paytr_reported_source_callback_hits=$count"
                done
              fi
            done
          done
          echo "access_log_visible=$HAVE_LOG"
          for endpoint in 'https://www.paytr.com/odeme/api/get-token' 'https://dev.paytr.com/iframe-api/iframe-api-2-adim'; do
            set +e
            result="$(curl -4 -sS --connect-timeout 10 --max-time 15 -o /dev/null -w '%{http_code} tls=%{ssl_verify_result} connect=%{time_connect}' -I "$endpoint")"
            exitcode=$?
            set -e
            if [[ "$endpoint" == *get-token ]]; then label=api; else label=docs; fi
            echo "outbound_$label exit=$exitcode result=$result"
          done
          # Signed HMAC, deliberately UNKNOWN merchant_oid: proves valid PayTR
          # transport without creating or settling any payment or order.
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $host='powderblue-dinosaur-538060.hostingersite.com';
          if (parse_url((string)config('app.url'),PHP_URL_HOST)!==$host
              || \Illuminate\Support\Facades\DB::connection()->getDatabaseName()==='') exit(2);
          $settings=\App\Models\PaytrSetting::find(1);
          if (!$settings?->is_enabled || !$settings->hasCredentials()
              || !config('newtic.paytr_webhooks_enabled')) exit(2);
          $oid='NTDIAG'.\Illuminate\Support\Str::upper(\Illuminate\Support\Str::random(23));
          if (\App\Models\PaytrPaymentAttempt::where('merchant_oid',$oid)->exists()) exit(2);
          $before=\App\Models\Order::count();
          $payload=[
            'merchant_oid'=>$oid,'status'=>'failed','total_amount'=>'0',
            'payment_type'=>'card','currency'=>'TL','payment_amount'=>'0','test_mode'=>'1',
            'hash'=>\App\Support\PaytrSignature::notificationHash($oid,'failed','0',$settings->merchant_key,$settings->merchant_salt)
          ];
          try {
            $res=\Illuminate\Support\Facades\Http::asForm()->timeout(20)->post('https://'.$host.'/odeme/paytr/bildirim',$payload);
            $status=$res->status();
            echo 'signed_unknown_order_http='.$status.PHP_EOL;
            echo 'signed_unknown_order_reached_hmac_verification='.($status===404&&trim($res->body())==='PAYTR notification could not be processed'?'yes':'no').PHP_EOL;
            echo 'no_payment_created='.(\App\Models\Order::count()===$before?'yes':'no').PHP_EOL;
            if($status!==404 || \App\Models\Order::count()!==$before) exit(3);
          } catch (\Throwable $e) {
            echo 'signed_unknown_order_transport_failed=yes'.PHP_EOL;exit(3);
          }
          PHP
          # PayTR read-only status inquiry for the *existing* screenshot order.
          # Provider credentials stay exclusively on Hostinger and are never printed.
          # No callback is forged, no stock/order/payment state is modified.
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $settings=\App\Models\PaytrSetting::find(1);
          $attempt=\App\Models\PaytrPaymentAttempt::query()
              ->where('merchant_oid','like','NTND7N2%')->latest('id')->first();
          if (!$settings?->hasCredentials() || !$attempt
              || parse_url((string)config('app.url'),PHP_URL_HOST)!=='powderblue-dinosaur-538060.hostingersite.com') {
              echo "provider_inquiry=blocked_missing_prerequisites\n"; exit(0);
          }
          echo "provider_merchant_matches_screenshot=".($settings->merchant_id==='777277'?'yes':'no')."\n";
          try {
              $token=base64_encode(hash_hmac('sha256',
                  $settings->merchant_id.$attempt->merchant_oid.$settings->merchant_salt,
                  $settings->merchant_key, true));
              $response=\Illuminate\Support\Facades\Http::asForm()
                  ->timeout(20)->post('https://www.paytr.com/odeme/durum-sorgu',[
                      'merchant_id'=>$settings->merchant_id,
                      'merchant_oid'=>$attempt->merchant_oid,
                      'paytr_token'=>$token,
                  ]);
              echo "provider_inquiry_http=".$response->status()."\n";
              $data=$response->json();
              if (!is_array($data)) {echo "provider_inquiry_valid_json=no\n";exit(0);}
              $status=$data['status']??'unknown';
              echo "provider_inquiry_result=".($status==='success'?'success':
                      ($status==='error'?'error':'other'))."\n";
              if($status==='success'){
                $currency=(string)($data['currency']??'');
                echo "provider_currency_expected=".(in_array($currency,['TL','TRY'],true)?'yes':'no')."\n";
                $amount=(string)($data['payment_amount']??'');
                $amount=str_replace(',','.',$amount);
                $valid=(bool)preg_match('/^\d{1,10}(?:\.\d{1,2})?$/D',$amount);
                $cents=$valid?(int)round(((float)$amount)*100):-1;
                echo "provider_payment_amount_matches_order=".($cents===$attempt->amount_cents?'yes':'no')."\n";
                echo "provider_test_payment=".((string)($data['test_mode']??'')==='1'?'yes':'no')."\n";
              } else {
                $err=(string)($data['err_no']??'');
                echo "provider_inquiry_safe_error_number=".
                    (preg_match('/^[0-9]{1,4}$/D',$err)?$err:'unknown')."\n";
              }
              echo "provider_inquiry_database_unchanged=yes\n";
          } catch(\Throwable $e) {
              echo "provider_inquiry_connection_failed=yes\n";
          }
          PHP
          REMOTE
