name: Deploy NEWTIC staging

on:
  workflow_dispatch:
  push:
    branches:
      - 'deploy/polaris-payment-breakdown-1-0-8'

permissions:
  contents: read

concurrency:
  group: newtic-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.NEWTIC_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e58a6b3bcb5fb9cd7d8dcf93a89fc1f1647a94b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, bcmath, gd
          coverage: none
      - name: Validate locked dependency versions before install
        run: |
          set -euo pipefail
          test -s composer.lock
          composer validate --strict --no-check-publish
          grep -Fq '"name": "firebase/php-jwt"' composer.lock
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Google OAuth signature-verification dependencies
        run: |
          set -euo pipefail
          composer check-platform-reqs --no-dev --no-interaction
          php -r 'require "vendor/autoload.php"; if (!class_exists("Firebase\\JWT\\JWT") || !class_exists("Firebase\\JWT\\JWK")) exit(1);'
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Install and compile frontend
        run: |
          npm install --ignore-scripts
          npm run build
          test -f public/build/manifest.json
          tar -czf newtic-build.tar.gz -C public build
      - name: Verify migrations and run PHP tests before deployment
        run: |
          php artisan migrate --env=testing --force
          php artisan test
      - name: Prepare SSH credentials and validate configuration
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "NEWTIC_SSH_PRIVATE_KEY secret missing"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "NEWTIC_SSH_KNOWN_HOSTS secret missing"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-deploy ~/.ssh/known_hosts
      - name: Upload asset bundle and deploy
        env:
          EXPECTED_SHA: 9e58a6b3bcb5fb9cd7d8dcf93a89fc1f1647a94b
        run: |
          set -euo pipefail
          SSH=(ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          SCP=(scp -P 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE="u880685189@147.79.123.121"
          "${SSH[@]}" "$REMOTE" 'mkdir -p ~/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy'
          "${SCP[@]}" newtic-build.tar.gz "$REMOTE:/home/u880685189/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy/newtic-build.tar.gz"
          "${SSH[@]}" "$REMOTE" "NEWTIC_EXPECTED_SHA=$EXPECTED_SHA bash -se" < scripts/deploy-staging.sh
      - name: Verify NEWTIC 1.0.8 admin payment breakdown on Polaris
        run: |
          set -Eeuo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          APP="$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic"
          WEB="$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/public_html"
          cd "$APP"
          test "$(git rev-parse HEAD)" = '9e58a6b3bcb5fb9cd7d8dcf93a89fc1f1647a94b'
          test "$(cat VERSION)" = '1.0.8'
          cmp "$APP/public/build/manifest.json" "$WEB/build/manifest.json"
          grep -Fq 'Vade farkı / PAYTR ödeme farkı' resources/views/admin/orders/show.blade.php
          grep -Fq 'PayTR doğrulanmış tahsilat' resources/views/admin/orders/show.blade.php
          grep -Fq 'OrderPaymentBreakdown::fromOrder' app/Http/Controllers/Admin/OrderController.php
          php artisan migrate:status > /dev/null
          php artisan route:list --name=orders.show | grep -F 'admin.orders.show'
          echo 'NEWTIC_1_0_8_ADMIN_PAYMENT_BREAKDOWN_VERIFIED'
          REMOTE
      - name: Verify public staging homepage
        run: |
          set -euo pipefail
          URL=https://powderblue-dinosaur-538060.hostingersite.com/
          curl --fail --show-error --silent --location --retry 3 "$URL" -o homepage.html
          grep -Fqi "POLARIS" homepage.html
          echo "NEWTIC staging homepage verified"
