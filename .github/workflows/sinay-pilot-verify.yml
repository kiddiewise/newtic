name: Verify Sinay completed 1.0.1 one-click update
on:
  push:
    branches: ['feature/merchant-one-click-updates']
    paths: ['.github/workflows/sinay-pilot-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing Hostinger SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-deploy ~/.ssh/known_hosts
      - name: Verify installed Sinay release and complete update state (read-only)
        run: |
          set -Eeuo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          APP="$HOME/domains/sinaydesign.com/newtic"
          WEB="$HOME/domains/sinaydesign.com/public_html"
          cd "$APP"
          test -f .env && test -f artisan && test -f vendor/autoload.php
          test "$(cat VERSION)" = '1.0.1'
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $releases=$app->make(App\Services\NewticReleaseManager::class);
          $state=$releases->state();
          $version=$releases->currentVersion();
          $status=(string)($state['status']??'missing');
          $target=(string)($state['version']??'missing');
          echo "SINAY_CURRENT_VERSION=$version\n";
          echo "SINAY_UPDATE_STATUS=$status\n";
          echo "SINAY_LAST_UPDATE_TARGET=$target\n";
          if ($version !== '1.0.1' || $status !== 'done' || $target !== '1.0.1' || $releases->hasUpdate() || $app->isDownForMaintenance()) exit(2);
          echo "SINAY_UPDATE_STATE_VERIFIED\n";
          PHP
          test -s "$APP/public/build/manifest.json"
          test -s "$WEB/build/manifest.json"
          cmp "$APP/public/build/manifest.json" "$WEB/build/manifest.json"
          php artisan migrate:status > /dev/null
          php artisan route:list --path=yazilim-guncellemeleri | grep -F 'admin.software-updates.index'
          echo "SINAY_WEBROOT_FRONTEND_MATCHED"
          REMOTE
      - name: Public website and admin login remain available
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 30 https://sinaydesign.com/admin/login -o /tmp/sinay-admin.html
          grep -Fq NEWTIC /tmp/sinay-admin.html
          curl -fsSL --max-time 30 https://sinaydesign.com/ -o /tmp/sinay-home.html
          grep -Fqi Sinay /tmp/sinay-home.html
          echo SINAY_1_0_1_STORE_AND_ADMIN_VERIFIED
