name: Modern Web Guidance (advisory)

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The scan is read-only and intentionally independent from staging deployment.
# It never writes to the working tree, changes application code or uses secrets.
concurrency:
  group: modern-web-guidance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-guidance:
    name: Audit modern web patterns
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DISABLE_TELEMETRY: '1'
      CI: 'true'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan resources with pinned Modern Web Guidance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modern-web-report
          npx --yes modern-web-guidance@1.0.0 legacy-scan resources --json > modern-web-report/findings.json
      - name: Summarize candidates with contextual-review warning
        run: node scripts/modern-web-guidance-report.mjs modern-web-report/findings.json
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-web-guidance-findings
          path: modern-web-report/
          if-no-files-found: warn
          retention-days: 7
