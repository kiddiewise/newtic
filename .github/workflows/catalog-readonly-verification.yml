name: NEWTIC catalog read-only verification

on:
  push:
    branches:
      - audit/catalog-verification-2026-11-12

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure verified staging SSH identity
        env:
          KEY: \${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN: \${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$KNOWN"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/newtic-audit
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-audit ~/.ssh/known_hosts
      - name: Report staging catalog counts (SELECT only; no writes or deploy)
        run: |
          set -euo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-audit \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 \
            u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic"
          php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = \Illuminate\Support\Facades\DB::connection();
          $count = static fn (string $table): int =>
              \Illuminate\Support\Facades\Schema::hasTable($table)
                  ? (int) $db->table($table)->count() : -1;
          $batches = \Illuminate\Support\Facades\Schema::hasTable('catalog_imports')
              ? $db->table('catalog_imports')->orderByDesc('id')->limit(6)->get([
                  'id','created_at','status','total_rows','processed_rows','created_rows',
                  'updated_rows','skipped_rows','failed_rows','publish_products',
                ])->toArray()
              : [];
          $statuses = \Illuminate\Support\Facades\Schema::hasTable('catalog_import_rows')
              ? $db->table('catalog_import_rows')->select('status')
                  ->selectRaw('count(*) as n')->groupBy('status')->pluck('n','status')->all()
              : [];
          $sample = \Illuminate\Support\Facades\Schema::hasTable('products')
              ? $db->table('products')
                  ->select('id','sku','name','stock_quantity','is_active','image_path')
                  ->orderByDesc('id')->limit(8)->get()->toArray()
              : [];
          $result = [
              'products' => $count('products'),
              'active_products' => $count('products') < 0 ? null :
                  (int) $db->table('products')->where('is_active',true)->count(),
              'categories' => $count('categories'),
              'product_images' => $count('product_images'),
              'imported_source_links' => $count('catalog_import_sources'),
              'import_batches' => $count('catalog_imports'),
              'import_row_statuses' => $statuses,
              'recent_imports' => $batches,
              'recent_products' => $sample,
          ];
          echo json_encode($result, JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          REMOTE
