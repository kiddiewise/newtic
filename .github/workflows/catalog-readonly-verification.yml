name: NEWTIC public catalog verification

on:
  push:
    branches:
      - audit/catalog-verification-2026-11-12

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Count publicly listed staging products and spot-check images (read-only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import json

          BASE='https://powderblue-dinosaur-538060.hostingersite.com/'
          class Catalog(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.names=[]
                  self.imgs=[]
                  self.has_next=False
                  self.capture=False
                  self.last=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  c=a.get('class','').split()
                  if tag=='a' and 'product-card-name' in c:
                      self.capture=True
                      self.last=''
                  if tag=='img' and 'product-card' in a.get('class',''):
                      self.imgs.append(a.get('src',''))
                  if tag=='a' and 'next' in a.get('rel','').split():
                      self.has_next=True
              def handle_data(self,data):
                  if self.capture:self.last+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.capture:
                      self.names.append(self.last.strip())
                      self.capture=False

          result={'pages_checked':0,'published_cards_count':0,'unique_product_names_count':0,
                  'pages':[],'image_checks':[],'scan_complete':False}
          all_names=[]
          image_urls=[]
          for page in range(1,41):
              url=urljoin(BASE,'ara'+('?page='+str(page) if page>1 else ''))
              req=Request(url,headers={'User-Agent':'NEWTIC-catalog-healthcheck/1.0'})
              with urlopen(req,timeout=18) as response:
                  markup=response.read().decode('utf-8','replace')
              p=Catalog();p.feed(markup)
              result['pages_checked']+=1
              result['pages'].append({'page':page,'visible_products':len(p.names),'next_page':p.has_next})
              if not p.names:break
              all_names+=p.names
              image_urls+=p.imgs
              if not p.has_next:
                  result['scan_complete']=True
                  break
          result['published_cards_count']=len(all_names)
          result['unique_product_names_count']=len(set(all_names))
          for src in list(dict.fromkeys(image_urls))[:5]:
              url=urljoin(BASE,src)
              try:
                  req=Request(url,method='HEAD',headers={'User-Agent':'NEWTIC-catalog-healthcheck/1.0'})
                  with urlopen(req,timeout=12) as response:
                      status=response.status
                      mime=response.headers.get('content-type','')
                  result['image_checks'].append({'path':src,'status':status,'mime':mime})
              except Exception as e:
                  result['image_checks'].append({'path':src,'error':type(e).__name__})
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
