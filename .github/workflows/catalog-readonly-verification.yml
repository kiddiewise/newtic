name: NEWTIC public catalog verification

on:
  push:
    branches:
      - audit/catalog-verification-2026-11-12

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect visible staging catalog over HTTPS (read-only)
        run: |
          set -euo pipefail
          BASE='https://powderblue-dinosaur-538060.hostingersite.com'
          for path in / /ara; do
            curl --fail --show-error --silent --location \
              --max-time 20 --retry 3 \
              -o "$(test "$path" = / && echo homepage.html || echo catalog.html)" \
              "$BASE$path"
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          import html, json, re
          from urllib.parse import urlparse, parse_qs

          class CatalogParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_product_name = False
                  self.current_name = ''
                  self.names = []
                  self.cards = 0
                  self.images = []
                  self.pagination = set()
                  self.headings = []
                  self.in_h1 = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  cls = attrs.get('class', '').split()
                  if tag == 'article' and 'product-card' in cls:
                      self.cards += 1
                  if tag == 'a' and 'product-card-name' in cls:
                      self.in_product_name = True
                      self.current_name = ''
                  if tag == 'img' and 'product-card' in attrs.get('class',''):
                      self.images.append(attrs.get('src',''))
                  if tag == 'a':
                      url = attrs.get('href','')
                      page = parse_qs(urlparse(url).query).get('page', [])
                      if page and page[0].isdigit():
                          self.pagination.add(int(page[0]))
                  if tag == 'h1':
                      self.in_h1 = True
              def handle_data(self, data):
                  if self.in_product_name:
                      self.current_name += data
                  if self.in_h1:
                      self.headings.append(data.strip())
              def handle_endtag(self, tag):
                  if tag == 'a' and self.in_product_name:
                      self.names.append(html.unescape(self.current_name).strip())
                      self.in_product_name = False
                  if tag == 'h1':
                      self.in_h1 = False

          result = {}
          for name in ('homepage','catalog'):
              text = open(name+'.html', encoding='utf8', errors='replace').read()
              p = CatalogParser()
              p.feed(text)
              result[name] = {
                'http_content_bytes': len(text),
                'product_cards_on_page': p.cards,
                'names_sample': p.names[:16],
                'heading': [x for x in p.headings if x][:3],
                'pagination_page_numbers': sorted(p.pagination),
                'demo_fallback_image_references': text.count('assets/products/demo-sinker.svg'),
              }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
