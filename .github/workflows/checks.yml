name: Tests and assets

on:
  pull_request:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Install and compile frontend
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Save prebuilt Vite assets for Hostinger (no Node required on server)
        uses: actions/upload-artifact@v4
        with:
          name: newtic-vite-build
          path: public/build/
          if-no-files-found: error
          retention-days: 14
      - name: Run migrations
        run: php artisan migrate --env=testing --force
      - name: Run tests
        run: php artisan test
      - name: Package verified frontend for staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-01-foundation-homepage' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          tar -czf newtic-build.tar.gz -C public build
      - name: Prepare staging SSH credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-01-foundation-homepage' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "Missing SSH deploy key"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing verified known_hosts"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-deploy ~/.ssh/known_hosts
      - name: Release verified build to Hostinger staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-01-foundation-homepage' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1)
          SCP=(scp -P 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1)
          REMOTE="u880685189@147.79.123.121"
          for attempt in 1 2 3; do
            echo "Hostinger deploy attempt $attempt/3"
            if "${SSH[@]}" "$REMOTE" 'mkdir -p ~/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy' \
              && "${SCP[@]}" newtic-build.tar.gz "$REMOTE:/home/u880685189/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy/newtic-build.tar.gz" \
              && "${SSH[@]}" "$REMOTE" "NEWTIC_EXPECTED_SHA=$EXPECTED_SHA bash -se" < scripts/deploy-staging.sh; then
              echo "Hostinger deploy complete"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Hostinger SSH unavailable after 3 attempts"
              exit 1
            fi
            sleep 7
          done
      - name: Verify staging homepage
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-01-foundation-homepage' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 https://powderblue-dinosaur-538060.hostingersite.com/ -o homepage.html
          grep -Fqi "POLARIS" homepage.html
          echo "Staging homepage verified"
