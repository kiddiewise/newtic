name: Tests and assets

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
      - main

permissions:
  contents: read

# Keep the most recent staging run queued while an ongoing release completes.
# This avoids concurrent Hostinger deployments from rapid UI commits.
concurrency:
  group: newtic-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: newtic_ci_root_only
          MYSQL_DATABASE: newtic_fresh_ci
          MYSQL_USER: newtic_install_ci
          MYSQL_PASSWORD: newtic_ci_temporary_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnewtic_ci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, bcmath, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate locked dependency versions before install
        run: |
          set -euo pipefail
          test -s composer.lock
          composer validate --strict --no-check-publish
          grep -Fq '"name": "firebase/php-jwt"' composer.lock
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Google OAuth signature-verification dependencies
        run: |
          set -euo pipefail
          composer check-platform-reqs --no-dev --no-interaction
          php -r 'require "vendor/autoload.php"; if (!class_exists("Firebase\\JWT\\JWT") || !class_exists("Firebase\\JWT\\JWK")) exit(1);'
      - name: Configure test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Install and compile frontend
        run: |
          npm install --ignore-scripts
          npm run build
          printf '%s\n' "$GITHUB_SHA" > public/build/newtic-revision.txt
      - name: Verify portable installer and webroot scripts
        run: |
          bash -n scripts/install-production.sh
          bash -n scripts/build-customer-release.sh
          bash -n scripts/quick-install.sh
          bash -n scripts/prepare-hostinger-webroot.sh
          bash -n scripts/verify-public-assets.sh
          bash -n scripts/deploy-staging.sh
          bash tests/install/test-hostinger-webroot.sh
          echo "Portable installer scripts and isolated first-install webroot tests passed"
      - name: Exercise brand-independent installer preflight
        run: |
          set -euo pipefail
          cp .env .env.newtic-ci-backup
          trap 'mv -f .env.newtic-ci-backup .env' EXIT
          sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|^APP_URL=.*|APP_URL=https://independent.example|' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          printf '\nDB_DATABASE=newtic_separate_ci\nDB_USERNAME=newtic_ci\nDB_PASSWORD=fake-ci-private-password\n' >> .env
          # Safe-mode values are provided once in .env.example; duplicates are forbidden.
          bash scripts/install-production.sh --check
          # Preview hostname is blocked by default and allowed only in test
          # mode with an explicit, unique opt-in.
          sed -i 's|^APP_URL=.*|APP_URL=https://customer-ci.hostingersite.com|' .env
          if bash scripts/install-production.sh --check; then
            echo "ERROR: temporary domain accepted without explicit opt-in" >&2
            exit 1
          fi
          sed -i 's/^NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=false/NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=true/' .env
          bash scripts/install-production.sh --check
          bash scripts/install-production.sh --check
          sed -i 's/^NEWTIC_CHECKOUT_TEST_MODE=false/NEWTIC_CHECKOUT_TEST_MODE=true/' .env
          bash scripts/install-production.sh --check
          sed -i 's/^NEWTIC_CHECKOUT_TEST_MODE=true/NEWTIC_CHECKOUT_TEST_MODE=false/' .env
          sed -i 's/^NEWTIC_PAYTR_CARD_PAYMENTS_ENABLED=false/NEWTIC_PAYTR_CARD_PAYMENTS_ENABLED=true/' .env
          if bash scripts/install-production.sh --check; then
            echo "ERROR: temporary domain accepted with live payment enabled" >&2
            exit 1
          fi
          sed -i 's/^NEWTIC_PAYTR_CARD_PAYMENTS_ENABLED=true/NEWTIC_PAYTR_CARD_PAYMENTS_ENABLED=false/' .env
          sed -i 's|^APP_URL=.*|APP_URL=https://independent.example|' .env
          if bash scripts/install-production.sh --check; then
            echo "ERROR: temporary-domain override accepted on a real domain" >&2
            exit 1
          fi
          sed -i 's/^NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=true/NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=false/' .env
          bash scripts/install-production.sh --check
          # Repeated payment flag lines are dangerous: reject ambiguous .env.
          printf '\nNEWTIC_PAYTR_WEBHOOKS_ENABLED=true\n' >> .env
          if bash scripts/install-production.sh --check; then
            echo "ERROR: conflicting duplicate environment keys accepted" >&2
            exit 1
          fi
          test -f .env.newtic-ci-backup
          mv -f .env.newtic-ci-backup .env
          trap - EXIT
      - name: Test Turkish phone formatter
        run: node --test tests/js/*.test.mjs
      - name: Verify NEWTIC standard WebP brand assets
        run: |
          set -euo pipefail
          file --mime-type public/assets/branding/newtic-logo.webp | grep -Fq image/webp
          file --mime-type public/assets/branding/newtic-mark.webp | grep -Fq image/webp
          test -s public/assets/branding/newtic-logo.webp
          test -s public/assets/branding/newtic-mark.webp
      - name: Verify admin CSS is present in compiled Vite assets
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          find public/build/assets -maxdepth 1 -name '*.css' -print -quit | grep -q . || { echo "No built CSS assets"; exit 1; }
          grep -RFlq --include='*.css' '.admin-app-shell' public/build/assets || { echo "Admin layout CSS missing from build"; exit 1; }
          grep -RFlq --include='*.css' '.admin-icon' public/build/assets || { echo "Admin icon size CSS missing from build"; exit 1; }
          echo "Admin styles successfully bundled"
      - name: Verify new corporate login / registration CSS is shipped
        run: |
          set -euo pipefail
          grep -REq --include='*.css' 'auth-artwork:{1,2}after' public/build/assets || { echo "White image transition missing from compiled CSS"; exit 1; }
          grep -RFlq --include='*.css' '.mobile-auth-tabs' public/build/assets || { echo "Mobile login/register tabs missing from compiled CSS"; exit 1; }
          grep -RFlq --include='*.css' '.auth-google-button' public/build/assets || { echo "Google auth button styles missing"; exit 1; }
          grep -RFlq --include='*.css' '.auth-forgot-link' public/build/assets || { echo "Password recovery link styling missing"; exit 1; }
          echo "Navy-white login and image fade included in the compiled Vite bundle"
      - name: Save prebuilt Vite assets for Hostinger (no Node required on server)
        uses: actions/upload-artifact@v4
        with:
          name: newtic-vite-build
          path: public/build/
          if-no-files-found: error
          retention-days: 14
      - name: Run migrations
        run: php artisan migrate --env=testing --force
      - name: Compile every Blade view
        run: php artisan view:cache
      - name: Run tests
        run: php artisan test
      - name: End-to-end blank MySQL first install with Hostinger PHP exec disabled
        run: |
          set -euo pipefail
          tar -czf newtic-smoke-assets.tar.gz -C public build
          rm -r public/build
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|^APP_URL=.*|APP_URL=https://independent.example|' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          cat >> .env <<'CONFIG'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=newtic_fresh_ci
          DB_USERNAME=newtic_install_ci
          DB_PASSWORD=newtic_ci_temporary_only
          # .env.example uses normal checkout with all live integrations disabled.
          CONFIG
          mkdir -p "$RUNNER_TEMP/newtic-noexec-bin"
          PHP_REAL="$(command -v php)"
          cat > "$RUNNER_TEMP/newtic-noexec-bin/php" <<'NOEXEC'
          #!/usr/bin/env bash
          exec "$NEWTIC_PHP_REAL" -d disable_functions=exec "$@"
          NOEXEC
          chmod 755 "$RUNNER_TEMP/newtic-noexec-bin/php"
          export NEWTIC_PHP_REAL="$PHP_REAL"
          export PATH="$RUNNER_TEMP/newtic-noexec-bin:$PATH"
          php -r 'if (function_exists("exec")) exit(1);'
          bash scripts/install-production.sh --check
          bash scripts/install-production.sh --install --assets-bundle "$PWD/newtic-smoke-assets.tar.gz"
          # After initial migrations, a new first-install must be rejected.
          if php artisan newtic:check-fresh-db; then
            echo "ERROR: existing database accepted as an empty installation target" >&2
            exit 1
          fi
          test -L public/storage
          php artisan migrate:status | grep -F 'create_newtic_installations_table'
          WEBROOT="$RUNNER_TEMP/newtic-fresh-webroot"
          mkdir -p "$WEBROOT"
          bash scripts/prepare-hostinger-webroot.sh --webroot "$WEBROOT"
          test -f "$WEBROOT/build/manifest.json"
          test ! -L "$WEBROOT/build"
          test ! -L "$WEBROOT/storage"
          test -d "$WEBROOT/storage"
          php artisan newtic:setup-token --private-file
          test -s storage/app/private/newtic-setup/mobile-install-code.txt
          echo "PASS: real MySQL migrations, disabled PHP exec, Node-free assets, physical webroot and first setup key."
          tar -xzf newtic-smoke-assets.tar.gz -C public
      - name: Prepare reproducible first-install asset bundle (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test "$(cat public/build/newtic-revision.txt)" = "$GITHUB_SHA"
          test -s public/build/manifest.json
          tar -czf newtic-install-assets.tar.gz -C public build
          tar -tzf newtic-install-assets.tar.gz | grep -Fx 'build/newtic-revision.txt'
      - name: Upload portable first-install bundle for merchants without Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: newtic-install-assets
          path: newtic-install-assets.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Package verified customer-ready standalone ZIP (source, vendor, Vite, docs)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/portable-install-readiness-audit' || github.ref == 'refs/heads/feat/merchant-ready-one-step-setup-20261123')
        run: |
          set -euo pipefail
          # All tests have finished; production-only vendor remains portable.
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          composer check-platform-reqs --no-dev --no-interaction
          bash scripts/build-customer-release.sh --output "$GITHUB_WORKSPACE/newtic-customer-install.zip"
          unzip -tq newtic-customer-install.zip
          unzip -Z1 newtic-customer-install.zip | grep -Fxq 'NEWTIC/NEWTIC-RELEASE-SHA256SUMS.txt'
          if unzip -Z1 newtic-customer-install.zip | grep -Eq '(^|/)(\.env|\.git|\.github|tests|node_modules)/'; then
            echo "ERROR: private/development content leaked into customer package" >&2
            exit 1
          fi
          ROOT="$RUNNER_TEMP/newtic-customer-package-smoke"
          mkdir -p "$ROOT"
          unzip -q newtic-customer-install.zip -d "$ROOT"
          php "$ROOT/NEWTIC/scripts/verify-customer-release.php" "$ROOT/NEWTIC"
          test ! -e "$ROOT/NEWTIC/.env"
          test -s "$ROOT/NEWTIC/vendor/autoload.php"
          test -f "$ROOT/NEWTIC/scripts/quick-install.sh"
          test -s "$ROOT/NEWTIC/public/build/manifest.json"
          # Check that package-only mode needs no server-side Composer/npm.
          cd "$ROOT/NEWTIC"
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|^APP_URL=.*|APP_URL=https://package-merchant.hostingersite.com|' .env
          sed -i 's/^NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=false/NEWTIC_INSTALL_ALLOW_HOSTINGER_TEMP_DOMAIN=true/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          printf '\nDB_DATABASE=newtic_fresh_ci\nDB_USERNAME=newtic_install_ci\nDB_PASSWORD=newtic_ci_temporary_only\n' >> .env
          bash scripts/install-production.sh --check
          # Create a second pristine schema: prove the extracted ZIP installs
          # to real MySQL without invoking Composer or npm on the server.
          php <<'PHP'
          <?php
          $db = new PDO('mysql:host=127.0.0.1;port=3306', 'root', 'newtic_ci_root_only');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec('CREATE DATABASE newtic_package_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          $db->exec("GRANT ALL PRIVILEGES ON newtic_package_ci.* TO 'newtic_install_ci'@'%'");
          PHP
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=newtic_package_ci/' .env
          bash scripts/install-production.sh --install
          php artisan migrate:status | grep -F 'create_newtic_installations_table'
          php artisan newtic:setup-token --private-file
          test -s storage/app/private/newtic-setup/mobile-install-code.txt
          echo "PASS: immutable standalone ZIP, real blank MySQL installation, no Composer/npm required, and private setup token."
      - name: Upload complete NEWTIC customer install ZIP
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/portable-install-readiness-audit' || github.ref == 'refs/heads/feat/merchant-ready-one-step-setup-20261123')
        uses: actions/upload-artifact@v4
        with:
          name: newtic-customer-complete-install
          path: |
            newtic-customer-install.zip
            newtic-customer-install.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Package verified frontend for staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          tar -czf newtic-build.tar.gz -C public build
      - name: Prepare staging SSH credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "Missing SSH deploy key"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing verified known_hosts"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-deploy ~/.ssh/known_hosts
      - name: Diagnose Hostinger 504 before publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        run: |
          set +e
          echo "=== External HTTP availability before publish ==="
          for path in / /admin/login /sepet; do
            curl -sS -L --max-time 12 -o /dev/null \
              -w "route=$path code=%{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\\n" \
              "https://powderblue-dinosaur-538060.hostingersite.com$path"
          done
          echo "=== Hostinger SSH runtime summary (no secrets) ==="
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=12 u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set +e
          APP="$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic"
          cd "$APP" || exit 0
          echo "time=$(date -u +%FT%TZ)"
          echo "revision=$(git rev-parse --short HEAD)"
          echo "load:"; uptime
          echo "disk:"; df -h "$HOME" | tail -1
          echo "runtime:"; timeout 12 php artisan about --only=environment
          echo "database:"; timeout 12 php artisan migrate:status | tail -5
          echo "error classes in last Laravel log lines (no raw messages):"
          if test -f storage/logs/laravel.log; then
            tail -n 250 storage/logs/laravel.log | grep -Eo '(PDOException|QueryException|ConnectionException|ErrorException|FatalError|Allowed memory size|SQLSTATE\\[[A-Z0-9]+\\])' | sort | uniq -c | tail -10
          fi
          REMOTE
          exit 0
      - name: Release verified build to Hostinger staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1)
          SCP=(scp -P 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1)
          REMOTE="u880685189@147.79.123.121"
          for attempt in 1 2 3; do
            echo "Hostinger deploy attempt $attempt/3"
            if "${SSH[@]}" "$REMOTE" 'mkdir -p ~/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy' \
              && "${SCP[@]}" newtic-build.tar.gz "$REMOTE:/home/u880685189/domains/powderblue-dinosaur-538060.hostingersite.com/newtic/.deploy/newtic-build.tar.gz" \
              && "${SSH[@]}" "$REMOTE" "NEWTIC_EXPECTED_SHA=$EXPECTED_SHA bash -se" < scripts/deploy-staging.sh; then
              echo "Hostinger deploy complete"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Hostinger SSH unavailable after 3 attempts"
              exit 1
            fi
            sleep 7
          done
      - name: Verify storefront, admin login and compiled admin stylesheet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEWTIC_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          SITE="https://powderblue-dinosaur-538060.hostingersite.com"
          curl --fail --show-error --silent --location --retry 3 "$SITE/" -o homepage.html
          grep -Fqi "POLARIS" homepage.html
          curl --fail --show-error --silent --location --retry 3 "$SITE/admin/login" -o admin-login.html
          grep -Fq "NEWTIC" admin-login.html
          ASSET=$(node -e "const m=require('./public/build/manifest.json'); process.stdout.write(m['resources/css/app.css'].file)")
          test -n "$ASSET"
          curl --fail --show-error --silent --location --retry 3 "$SITE/build/$ASSET" -o deployed-admin.css
          grep -Fq '.admin-app-shell' deployed-admin.css
          grep -Fq '.admin-icon' deployed-admin.css
          echo "Staging storefront, admin login and published admin stylesheet verified"

  publish_customer_candidate:
    name: Publish permanent, traceable customer installation candidate
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/portable-install-readiness-audit' || github.ref == 'refs/heads/feat/merchant-ready-one-step-setup-20261123')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: newtic-customer-complete-install
      - name: Verify checksums and publish official versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c newtic-customer-install.zip.sha256
          test ! -e .env
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            # Versioned, stable releases are visible to the merchant updater.
            version="$(unzip -p newtic-customer-install.zip NEWTIC/VERSION | tr -d '\r\n')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION file"; exit 1; }
            tag="v$version"
            title="NEWTIC $version | Tam Kurulum ve Güncelleme"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "ERROR: $tag already published. Bump VERSION before publishing another stable release." >&2
              exit 1
            fi
            release_flags=(--latest)
          else
            tag="newtic-customer-rc-${GITHUB_SHA:0:12}"
            title="NEWTIC | Portable customer installation candidate ${GITHUB_SHA:0:12}"
            release_flags=(--prerelease)
          fi
          gh release create "$tag" \
            newtic-customer-install.zip newtic-customer-install.zip.sha256 \
            --target "$GITHUB_SHA" "${release_flags[@]}" \
            --title "$title" \
            --notes "NEWTIC tam kurulum ve sürüm güncelleme paketi. Laravel uygulaması, kilitli PHP bağımlılıkları, derlenmiş CSS/JS, yönetim paneli güncelleme bildirimi ve hızlı kurulum araçları. Müşteriye ait veritabanı, ödeme bilgileri ve yüklemeler bu kurulum ZIP\x27ine dahil değildir. Kaynak revizyonu: $GITHUB_SHA. Kurulum öncesi birlikte yayınlanan SHA256 dosyasını doğrulayın."
