name: One-time reconcile NEWTIC staging commits

on:
  push:
    branches:
      - feat/phase-01-foundation-homepage
    paths:
      - .github/workflows/reconcile-staging-history.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Establish trusted staging SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-reconcile
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-reconcile ~/.ssh/known_hosts
      - name: Bring server's three missing commits into GitHub without discarding them
        env:
          GIT_SSH_COMMAND: "ssh -p 65002 -i /home/runner/.ssh/newtic-reconcile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"
        run: |
          set -euo pipefail
          git config user.name "NEWTIC Reconcile Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "ssh://u880685189@147.79.123.121:65002/home/u880685189/domains/powderblue-dinosaur-538060.hostingersite.com/newtic" HEAD:refs/remotes/staging/current
          STAGING_HEAD=$(git rev-parse refs/remotes/staging/current)
          echo "Staging HEAD prefix: ${STAGING_HEAD:0:10}"
          if [[ "$STAGING_HEAD" != fd2b5b6* ]]; then
            echo "Unexpected staging revision; refusing to merge any unknown changes"
            exit 1
          fi
          BASE=$(git merge-base HEAD refs/remotes/staging/current)
          if [[ "$BASE" != d13b9b4701b249c8ce85f7ec21e15d2a807f1c8b ]]; then
            echo "Unexpected common ancestor; stop for review"
            exit 1
          fi
          echo "Staging-only changed files:"
          git diff --name-only "$BASE" refs/remotes/staging/current
          echo "Merging staging-only import improvements with infinite catalog scroll..."
          git merge --no-ff --no-edit refs/remotes/staging/current
          echo "Merged HEAD: $(git rev-parse HEAD)"
          echo "Parents: $(git log -1 --format=%p)"
          git push origin HEAD:refs/heads/feat/phase-01-foundation-homepage
      - name: Trigger verified staging tests and deploy after successful reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-staging.yml --ref feat/phase-01-foundation-homepage
          echo "Reconciled commit pushed; staging deployment dispatched with full tests"
