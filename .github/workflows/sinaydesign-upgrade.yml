name: Sinay Design 1.0.9 safe deployment recovery
on:
  push:
    branches: [deploy/sinay-paytr-1-0-9]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinaydesign-newtic-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cc8996035370ce4fb17c70970d20d7ac06ec3be
      - name: Configure existing Hostinger connection
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-deploy ~/.ssh/known_hosts
      - name: Inspect and preserve local source changes before retry
        run: |
          set -euo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          cd "$HOME/domains/sinaydesign.com/newtic"
          grep -Fxq 'APP_URL=https://sinaydesign.com' .env
          grep -Fxq 'DB_DATABASE=u880685189_sinay_newtic' .env
          test "$(git branch --show-current)" = main
          git fetch --no-tags origin main
          TARGET=3cc8996035370ce4fb17c70970d20d7ac06ec3be
          git merge-base --is-ancestor HEAD "$TARGET"
          echo "Installed revision: $(git rev-parse --short HEAD)"
          git status --short --untracked-files=no
          git diff --numstat HEAD
          if ! git diff --quiet --cached; then
            echo 'Staged modifications require review; refusing to change anything.'
            exit 1
          fi
          if ! git diff --quiet HEAD; then
            BACKUP="$PWD/storage/app/private/newtic-deployment-backups/preflight-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BACKUP"
            git diff --binary HEAD > "$BACKUP/local-source.patch"
            git status --short --untracked-files=no > "$BACKUP/status.txt"
            chmod 600 "$BACKUP/"*
            # Only revert a local modification if it is exactly the target
            # content, or is a tracked generated build file already superseded
            # by the verified frontend archive. Never discard custom source.
            git diff --name-only -z HEAD > "$BACKUP/paths.bin"
            mapfile -d '' FILES < "$BACKUP/paths.bin"
            for f in "${FILES[@]}"; do
              if [[ "$f" == VERSION ]] && test -f VERSION && grep -Exq '[0-9]+\.[0-9]+\.[0-9]+' VERSION && php -r 'exit(version_compare(trim(file_get_contents("VERSION")), "1.0.9", "<=") ? 0 : 1);'; then
                echo "Superseded local numeric version marker: $(cat VERSION)"
              elif [[ "$f" == scripts/quick-install.sh ]] && git show HEAD:scripts/quick-install.sh | cmp -s - scripts/quick-install.sh; then
                echo "Installer executable-bit difference only"
              elif [[ "$f" == public/build/* ]] && test -f "$f"; then
                echo "Generated build change: $f"
              elif test -f "$f" && git cat-file -e "$TARGET:$f" 2>/dev/null && git show "$TARGET:$f" | cmp -s - "$f"; then
                echo "Local file already equals target: $f"
              else
                echo "REVIEW_REQUIRED: $f"
                exit 1
              fi
            done
            git restore --source=HEAD --worktree -- "${FILES[@]}"
            echo 'Local patch preserved privately; only verified equivalent/generated changes restored.'
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          REMOTE
      - name: Retry verified 1.0.9 archive with existing backup safeguards
        run: |
          set -euo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes u880685189@147.79.123.121 "NEWTIC_EXPECTED_SHA=3cc8996035370ce4fb17c70970d20d7ac06ec3be bash -se" < scripts/deploy-sinaydesign-upgrade.sh
      - name: Verify deployed PayTR settings and public routes
        run: |
          set -euo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/sinaydesign.com/newtic"
          test "$(git rev-parse HEAD)" = '3cc8996035370ce4fb17c70970d20d7ac06ec3be'
          test "$(cat VERSION)" = '1.0.9'
          php artisan migrate:status | grep 'add_merchant_paytr_activation' | grep -F Ran
          grep -Fq 'installments_enabled' resources/views/admin/paytr-settings.blade.php
          cmp public/build/manifest.json ../public_html/build/manifest.json
          echo SINAY_PAYTR_1_0_9_VERIFIED
          REMOTE
          curl -fsSL --retry 2 --max-time 20 https://sinaydesign.com/ -o home.html
          curl -fsSL --retry 2 --max-time 20 https://sinaydesign.com/admin/login -o admin.html
          grep -Fqi 'Sinay Design' home.html
          grep -Fq NEWTIC admin.html
