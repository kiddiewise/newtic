name: NEWTIC 1.0.1 Sinay pilot prerelease

on:
  push:
    branches: ['feature/merchant-one-click-updates']
    paths:
      - 'VERSION'
      - '.github/workflows/sinay-pilot-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check target version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.value == '1.0.1'
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        if: steps.version.outputs.value == '1.0.1'
        with:
          node-version: '22'
      - name: Verify and package the immutable release
        if: steps.version.outputs.value == '1.0.1'
        run: |
          set -Eeuo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          php artisan test
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          printf '%s\n' "$GITHUB_SHA" > public/build/newtic-revision.txt
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          bash scripts/build-customer-release.sh --output "$GITHUB_WORKSPACE/newtic-customer-install.zip"
          sha256sum -c newtic-customer-install.zip.sha256
      - name: Publish tagged pilot prerelease (hidden from stable channel)
        if: steps.version.outputs.value == '1.0.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v1.0.1 newtic-customer-install.zip newtic-customer-install.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "NEWTIC 1.0.1 Sinay Pilot" --notes "Verified prerelease for Sinay Design's pinned update channel."
