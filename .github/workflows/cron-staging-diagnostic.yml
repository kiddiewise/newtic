name: One-time staging cron diagnostics

on:
  push:
    branches:
      - feat/phase-01-foundation-homepage
    paths:
      - .github/workflows/cron-staging-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare fixed Hostinger SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.NEWTIC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEWTIC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/newtic-cron-check
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/newtic-cron-check ~/.ssh/known_hosts
      - name: Verify staging shell wrapper and run one safe read-only Kargo GET pass
        run: |
          set -euo pipefail
          ssh -p 65002 -i ~/.ssh/newtic-cron-check -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
              u880685189@147.79.123.121 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/powderblue-dinosaur-538060.hostingersite.com/newtic"
          echo "staging cron diagnostic UTC=$(date -u +%FT%TZ)"
          echo "app present?"
          if [ ! -f "$APP/artisan" ] || [ ! -f "$APP/.env" ]; then
            echo "FAIL: staging Laravel files missing"; exit 2
          fi
          echo "wrapper present?"
          if [ ! -f "$APP/scripts/cron-shipping-sync.sh" ]; then
            echo "FAIL: staging wrapper missing"; exit 3
          fi
          echo "wrapper file metadata:"
          stat -c '%n bytes=%s perms=%a modified=%y' "$APP/scripts/cron-shipping-sync.sh"
          echo "current SSH shell PATH:"
          printf '%s\n' "$PATH" | sed 's,/:,/,' || true
          echo "PHP availability:"
          command -v php || true
          echo "PHP version:"
          php -r 'echo PHP_VERSION, PHP_EOL;' || true
          echo "Current staging commit:"
          git -C "$APP" rev-parse --short HEAD
          echo "Run wrapper (Dummy Kargo GET only; no shipment creation):"
          set +e
          timeout 95 /bin/sh "$APP/scripts/cron-shipping-sync.sh"
          result=$?
          set -e
          echo "wrapper_exit_code=$result"
          if [ "$result" -ne 0 ]; then
            echo "DIAGNOSIS: Wrapper not succeeding over SSH; investigate before checking hPanel output"
          else
            echo "DIAGNOSIS: Wrapper works over SSH; hPanel schedule/cron environment needs verification"
          fi
          REMOTE
